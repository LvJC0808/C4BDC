services:
  app:
    image: bdc2026:latest
    pull_policy: never
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./temp:/app/temp
    working_dir: /app
    command: /bin/bash /app/test.sh
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - MCAP_MIN_LARGE=3
      - MCAP_CAND_K=10
      - MCAP_LARGE_Q=0.5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    privileged: true
    mem_limit: 16g
    memswap_limit: 16g
    cpus: 10.0